; ==============================================================================
; PLATFORMIO CONFIGURATION: DUAL-NODE CRYPTOGRAPHIC E-BIKE SECURITY ARCHITECTURE
; Shared single codebase targeting XIAO ESP32-S3 (Master Hub) and XIAO ESP32-C6 (Enforcer)
; ==============================================================================

[platformio]
default_envs = xiao_esp32s3, xiao_esp32c6
src_dir = src

[env]
framework = arduino
platform = espressif32 @ ^6.5.0
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D MBEDTLS_CONFIG_FILE='<mbedtls/esp_config.h>'

; ------------------------------------------------------------------------------
; NODE 1: Seeed Studio XIAO ESP32-S3 (Wireless Master Hub - Handlebars / Headlight)
; ------------------------------------------------------------------------------
[env:xiao_esp32s3]
board = seeed_xiao_esp32s3
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.partitions = default_8MB.csv
build_src_filter = +<main.cpp>
build_flags =
    ${env.build_flags}
    -D CONFIG_IDF_TARGET_ESP32S3=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
lib_deps =
    ${env.lib_deps}

; ------------------------------------------------------------------------------
; NODE 2: Seeed Studio XIAO ESP32-C6 (Wired Enforcer Node - HV Battery / Motor Box)
; ------------------------------------------------------------------------------
[env:xiao_esp32c6]
board = seeed_xiao_esp32c6
board_build.mcu = esp32c6
board_build.f_cpu = 160000000L
board_build.partitions = min_spiffs.csv
build_src_filter = +<main.cpp>
build_flags =
    ${env.build_flags}
    -D CONFIG_IDF_TARGET_ESP32C6=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ${env.lib_deps}
